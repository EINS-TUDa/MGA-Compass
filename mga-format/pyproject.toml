[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mga_format"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "mga-format"
version = "0.1.0"
description = "The data format in which MGA Surveyor hands near-optimal sets to MGA Compass"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "pydantic",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]
