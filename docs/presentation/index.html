<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentations</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --fg: #1a1d23;
    --muted: #5b6270;
    --card-bg: #ffffff;
    --card-border: #e2e5ea;
    --accent: #2451c9;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eef0f3;
      --muted: #9aa2b1;
      --card-bg: #1d2026;
      --card-border: #2a2e36;
      --accent: #5b8dff;
      --accent-fg: #0b0d10;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  p.subtitle {
    margin: 0 0 40px;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 560px) {
    .options { grid-template-columns: 1fr 1fr; }
  }
  a.card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 28px 20px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  .card .place {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card .event {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  .card .go {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }
  .card .go svg {
    width: 14px;
    height: 14px;
    transition: transform 0.15s ease;
  }
  a.card:hover .go svg, a.card:focus-visible .go svg {
    transform: translateX(3px);
  }
</style>
</head>
<body>
<main>
  <h1>Presentations</h1>
  <p class="subtitle">Pick a talk to view the slides.</p>
  <div class="options">
    <a class="card" href="Trondheim/">
      <div class="place">Trondheim</div>
      <div class="event">EEM 2026</div>
      <span class="go">View slides
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
    <a class="card" href="Freiburg/">
      <div class="place">Freiburg</div>
      <div class="event">openmod Workshop 2026</div>
      <span class="go">View slides
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </div>
</main>
</body>
</html>
