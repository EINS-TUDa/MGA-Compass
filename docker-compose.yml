services:
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=["http://localhost"]
      # Near-optimal set to download at startup: the archive a GitHub release of
      # scripts/publish_dataset.py holds, .../releases/download/<tag>/near-optimal-set.zip.
      # Required until a set in this format is published to default to.
      - DATASET_URL=${DATASET_URL:?set DATASET_URL to a near-optimal set archive (.../near-optimal-set.zip)}

  frontend:
    build: ./app/frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
