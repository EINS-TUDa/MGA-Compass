[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mga_surveyor"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
testpaths = ["tests"]

[project]
name = "mga-surveyor"
version = "0.1.0"
description = "Near-optimal solution space exploration for PyPSA models — a drop-in alternative to PyPSA's built-in MGA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypsa>=1.2.0",
    "pandas",
    "netCDF4",
    "gurobipy>=13.0.2",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]
