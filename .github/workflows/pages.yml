name: Deploy Presentations to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/presentation/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            docs/presentation/Trondheim/package-lock.json
            docs/presentation/Freiburg/package-lock.json

      - name: Build Trondheim
        run: |
          npm ci
          npm run build
        working-directory: docs/presentation/Trondheim

      - name: Build Freiburg
        run: |
          npm ci
          npm run build
        working-directory: docs/presentation/Freiburg

      # Each presentation is its own self-contained reveal.js checkout (its
      # own index.html/dist/plugin/etc at its own root, built in place by
      # gulp above) -- assembled here into one Pages site so each is served
      # at its own top-level path (/Trondheim, /Freiburg) regardless of
      # where they live in the repo. node_modules is excluded: it's only
      # needed to build, never served.
      - name: Assemble Pages site
        run: |
          mkdir -p _site/Trondheim _site/Freiburg
          rsync -a --exclude node_modules docs/presentation/Trondheim/ _site/Trondheim/
          rsync -a --exclude node_modules docs/presentation/Freiburg/ _site/Freiburg/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
